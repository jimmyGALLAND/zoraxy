<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paramètres SKYNET SSO</title><link rel="stylesheet" href="options.css"></head>
<body><main><header><span class="mark">S</span><div><h1>SKYNET SSO</h1><p>Paramètres de l’extension Firefox</p></div></header>
<label for="issuer">URL du serveur Zoraxy Auth</label><input id="issuer" type="url" placeholder="https://auth.celjim.fr">
<label for="hosts">Domaines sur lesquels afficher la barre</label><textarea id="hosts" rows="6" placeholder="celjim.fr&#10;diagimm.fr"></textarea><p class="hint">Un domaine par ligne. Les sous-domaines sont inclus automatiquement. Exemple : celjim.fr couvre cloud.celjim.fr.</p>
<button id="save">Enregistrer</button><span id="result" role="status"></span></main><script src="options.js"></script></body></html>
